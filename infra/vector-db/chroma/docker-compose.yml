version: '3.9'

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: rag-assistant-chroma-db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: always

  chroma-manager:
    image: fengzhichao/chromadb-admin:latest
    container_name: chroma-manager
    ports:
      - "8001:3001" # 내부 포트가 3001인 것을 로그에서 확인하여 수정함
    environment:
      - CHROMA_SERVER_URL=http://chroma:8000
    depends_on:
      - chroma